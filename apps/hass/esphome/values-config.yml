---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
global:
  fullnameOverride: esphome
controllers:
  esphome:
    pod:
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/multus-iot

    containers:
      app:
        image:
          repository: ghcr.io/esphome/esphome
          tag: "2026.9"

service:
  app:
    controller: esphome
    ports:
      http:
        port: 6052
route:
  app:
    parentRefs:
      - name: external
        namespace: gateway-system
        sectionName: https
    hostnames:
      - esphome.cjf.sh
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: app
            port: http

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: zfs-dataset
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /config
        readOnly: false

  secrets:
    type: secret
    name: esphome
    globalMounts:
      - path: /config/secrets.yaml
        subPath: secrets.yaml

  cache:
    type: emptyDir
    advancedMounts:
      esphome:
        app:
          - path: /cache

serviceAccount:
  esphome: {}

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
global:
  fullnameOverride: zigbee2mqtt
controllers:
  zigbee2mqtt:
    containers:
      app:
        image:
          repository: docker.io/koenkk/zigbee2mqtt
          tag: 2.14.2
        securityContext:
          capabilities:
            add: ["SYS_ADMIN"]
        resources:
          limits:
            devic.es/zigbee: 1

service:
  app:
    controller: zigbee2mqtt
    ports:
      http:
        port: 8080
route:
  app:
    parentRefs:
      - name: external
        namespace: gateway-system
        sectionName: https
    hostnames:
      - zigbee.cjf.sh
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: app
            port: http

persistence:
  config:
    existingClaim: "{{ .Release.Name }}"
    globalMounts:
      - path: /app/data

serviceAccount:
  zigbee2mqtt: {}

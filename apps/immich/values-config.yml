---
controllers:
  main:
    containers:
      main:
        env:
          REDIS_HOSTNAME: immich-redis
          DB_HOSTNAME: immich-db-rw
          DB_DATABASE_NAME: immich
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: password

immich:
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-library

server:
  service:
    main:
      type: LoadBalancer

  route:
    main:
      enabled: true
      hostnames:
        - pics.cjf.sh
      parentRefs:
        - name: external
          namespace: gateway-system
          sectionName: https
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: main

  ingress:
    main:
      enabled: false

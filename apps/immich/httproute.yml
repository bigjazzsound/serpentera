---
# immich uses the upstream immich Helm chart (not bjw-s app-template), so the
# HTTPRoute is declared here rather than via `route:` in values-config.yml.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-immich-server
  namespace: immich
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway-system
      sectionName: https
  hostnames:
    - pics.cjf.sh
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: immich-immich-server
          port: 2283
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
global:
  fullnameOverride: super-productivity

controllers:
  main:
    replicas: 1
    containers:
      main:
        image:
          repository: ghcr.io/super-productivity/supersync
          tag: v20.1.0

        env:
          - name: PORT
            value: "1900"

          - name: HOST
            value: "0.0.0.0"

          - name: NODE_ENV
            value: "development"

          - name: TEST_MODE
            value: "true"

          - name: TEST_MODE_CONFIRM
            value: "yes-i-understand-the-risks"

          - name: PUBLIC_URL
            value: "https://sp.cjf.sh"

          - name: WEBAUTHN_RP_ID
            value: "sp.cjf.sh"

          - name: WEBAUTHN_ORIGIN
            value: "https://sp.cjf.sh"

          - name: CORS_ORIGINS
            value: "https://app.super-productivity.com"

          - name: ALLOWED_EMAILS
            value: "todo@cjf.sh"

          - name: REQUIRE_DATABASE_POOL_LIMITS
            value: "true"

          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: super-productivity-db
                key: username

          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: super-productivity-db
                key: password

          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: super-productivity-db
                key: dbname

          - name: DATABASE_URL
            value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@supersync-db-rw:5432/$(POSTGRES_DB)?connection_limit=60&pool_timeout=10"

        ports:
          - name: http
            containerPort: 1900
            protocol: TCP

        envFrom:
          - secret: super-productivity-jwt

        probes:
          startup:
            enabled: true
            type: HTTP
            path: /health
            port: http
            spec:
              initialDelaySeconds: 10
              periodSeconds: 5
              failureThreshold: 30

          liveness:
            enabled: true
            type: HTTP
            path: /live
            port: http
            spec:
              periodSeconds: 30
              timeoutSeconds: 5

          readiness:
            enabled: true
            type: HTTP
            path: /health
            port: http
            spec:
              periodSeconds: 10
              timeoutSeconds: 5

        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    initContainers:
      migrate-db:
        image:
          repository: ghcr.io/super-productivity/supersync
          tag: v20.1.0

        command:
          - sh
          - -c
          - sh scripts/migrate-deploy.sh

        env:
          - name: REQUIRE_DATABASE_POOL_LIMITS
            value: "true"

          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: super-productivity-db
                key: username

          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: super-productivity-db
                key: password

          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: super-productivity-db
                key: dbname
          - name: DATABASE_URL
            value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@supersync-db-rw:5432/$(POSTGRES_DB)?connection_limit=60&pool_timeout=10"

      # The image ships /app/public, but readOnlyRootFilesystem makes it
      # read-only, and the app copies files into it at startup.
      copy-public:
        image:
          repository: ghcr.io/super-productivity/supersync
          tag: v20.1.0
        command:
          - sh
          - -c
          - cp -r /app/public/* /tmp/public/

service:
  app:
    controller: main
    ports:
      http:
        port: 1900

route:
  app:
    parentRefs:
      - name: external
        namespace: gateway-system
        sectionName: https

    hostnames:
      - sp.cjf.sh

    rules:
      # Block the test-mode routes at the gateway.
      - matches:
          - path:
              type: PathPrefix
              value: /api/test
        filters:
          - type: ExtensionRef
            extensionRef:
              group: gateway.envoyproxy.io
              kind: HTTPRouteFilter
              name: super-productivity-deny-test-api

      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: app
            port: http

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: zfs-dataset
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /app/data

  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp

  public:
    type: emptyDir
    advancedMounts:
      main:
        copy-public:
          - path: /tmp/public
        main:
          - path: /app/public

serviceAccount:
  main: {}

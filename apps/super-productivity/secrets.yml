---
# Password generation via external-secrets.
#
# There is no SecretStore/ClusterSecretStore in this repo - external-secrets
# is used purely through its self-contained `Password` generator, which needs
# no external backend. See apps/immich/secrets.yml for the same pattern.
#
# `encoding: hex` with `symbols: 0` and `digits: 0` produces pure hex output.
# This matters for the database password specifically: it is embedded in the
# DATABASE_URL, and upstream's env.example warns that a base64 `/` breaks the
# connection-string parsing. Hex is URL-safe. Hex is equally valid as a JWT
# signing key, so both secrets use the same encoding.
#
# The generator produces ONE random value per entry in `secretKeys`, so the
# fixed values (`username`, `dbname`) are supplied by the ExternalSecret
# target template rather than by the generator.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: super-productivity-db
  namespace: super-productivity
spec:
  length: 48
  digits: 0
  symbols: 0
  noUpper: false
  allowRepeat: true
  encoding: hex
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: super-productivity-db
  namespace: super-productivity
spec:
  # CreatedOnce: the value is generated once and then left alone. It MUST
  # stay stable - CNPG stores the role password from this secret, so
  # regenerating it would break the database connection.
  refreshPolicy: CreatedOnce
  target:
    name: super-productivity-db
    template:
      data:
        username: supersync
        dbname: supersync
        password: "{{.password}}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: super-productivity-db
---
# The JWT signing secret.
#
# Upstream: "Keep JWT_SECRET stable: domain-separated HMACs use it for refresh
# authenticity and retry derivation. Rotating it requires OAuth-clients to
# reconnect." So this is also CreatedOnce, never Periodic.
#
# CAVEAT: deleting the `super-productivity-jwt` Secret causes the generator to
# produce a NEW value, which invalidates every existing session and every
# issued refresh token. Do not delete it casually. Same caveat applies to
# `super-productivity-db` above.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: super-productivity-jwt
  namespace: super-productivity
spec:
  length: 64
  digits: 0
  symbols: 0
  noUpper: false
  allowRepeat: true
  encoding: hex
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: super-productivity-jwt
  namespace: super-productivity
spec:
  refreshPolicy: CreatedOnce
  target:
    name: super-productivity-jwt
    template:
      data:
        JWT_SECRET: "{{.password}}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: super-productivity-jwt

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: super-productivity
  namespace: flux-system
spec:
  chart:
    spec:
      chart: app-template
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: super-productivity
      version: 5.3.0
  install:
    createNamespace: true
  interval: 1m0s
  targetNamespace: super-productivity
  valuesFrom:
    - kind: ConfigMap
      name: super-productivity-config-values

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
global:
  fullnameOverride: audiobookshelf

defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: serpentera

controllers:
  abs:
    type: statefulset
    containers:
      app:
        image:
          repository: ghcr.io/advplyr/audiobookshelf
          tag: 2.37.1

service:
  app:
    controller: abs
    ports:
      http:
        port: 80
route:
  app:
    parentRefs:
      - name: external
        namespace: gateway-system
        sectionName: https
    hostnames:
      - abs.cjf.sh
      - audiobookshelf.cjf.sh
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: app
            port: http

persistence:
  config:
    type: hostPath
    hostPath: /var/tank/audiobookshelf/config
    globalMounts:
      - path: /config
  audiobooks:
    type: hostPath
    hostPath: /var/tank/audiobookshelf/audiobooks
    globalMounts:
      - path: /audiobooks
  podcasts:
    type: hostPath
    hostPath: /var/tank/audiobookshelf/podcasts
    globalMounts:
      - path: /podcasts
  metadata:
    type: hostPath
    hostPath: /var/tank/audiobookshelf/metadata
    globalMounts:
      - path: /metadata

serviceAccount:
  audiobookshelf: {}

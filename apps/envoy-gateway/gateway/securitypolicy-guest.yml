---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: external-guest
  namespace: gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external-guest
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-lan
        action: Allow
        principal:
          clientCIDRs:
            - 10.0.0.0/22

      - name: allow-guest
        action: Allow
        principal:
          clientCIDRs:
            - 192.168.241.0/24

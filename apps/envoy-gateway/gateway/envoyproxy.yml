---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: external
  namespace: gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests:
              cpu: 150m
              memory: 640Mi
            limits:
              cpu: 500m
              memory: 1Gi
  logging:
    level:
      # Component keys here become --component-log-level <key>:<level> and MUST
      # be a logger component registered in the Envoy build (e.g. upstream, hcm,
      # router, connection). "envoy" is not one of them - Envoy 1.39 throws
      # MalformedArgvException and exits 1 during argv parsing, before any
      # config is read, which crash-loops the pod with no useful logs.
      default: info

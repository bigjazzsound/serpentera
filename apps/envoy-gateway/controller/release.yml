---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
    namespace: flux-system
  install:
    createNamespace: true
  interval: 1m0s
  targetNamespace: envoy-gateway-system
  valuesFrom:
    - kind: ConfigMap
      name: envoy-gateway-config-values
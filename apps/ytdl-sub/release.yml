---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ytdl-sub
  namespace: flux-system
spec:
  chart:
    spec:
      chart: app-template
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: ytdl-sub
      version: 5.3.0
  install:
    createNamespace: true
  interval: 1m0s
  storageNamespace: ytdl-sub
  targetNamespace: ytdl-sub
  valuesFrom:
    - kind: ConfigMap
      name: ytdl-sub-config-values

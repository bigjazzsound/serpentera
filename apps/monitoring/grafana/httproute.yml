---
# Grafana uses the upstream grafana Helm chart (not bjw-s app-template), so the
# HTTPRoute is declared here rather than via `route:` in values-config.yml.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitoring-grafana
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway-system
      sectionName: https
  hostnames:
    - grafana.cjf.sh
    - monitor.cjf.sh
    - monitoring.cjf.sh
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: monitoring-grafana
          port: 80
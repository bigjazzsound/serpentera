---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
controllers:
  chat:
    containers:
      app:
        image:
          repository: ghcr.io/cinnyapp/cinny
          tag: v4.12.7
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
service:
  app:
    controller: chat
    type: LoadBalancer
    ports:
      http:
        port: 80
route:
  app:
    parentRefs:
      - name: external
        namespace: gateway-system
        sectionName: https
    hostnames:
      - chat.cjf.sh
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: app
            port: http

serviceAccount:
  cinny: {}

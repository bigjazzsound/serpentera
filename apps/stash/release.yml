---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stash
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: stash
    namespace: flux-system
  install:
    createNamespace: true
  interval: 1m0s
  targetNamespace: stash
  valuesFrom:
    - kind: ConfigMap
      name: stash-config-values
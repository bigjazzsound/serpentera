---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
global:
  fullnameOverride: actual-budget

controllers:
  actual-budget:
    containers:
      app:
        image:
          repository: ghcr.io/actualbudget/actual
          tag: 26.10.0
        envFrom:
          - secretRef:
              name: actual-budget

service:
  app:
    controller: actual-budget
    ports:
      http:
        port: 5006
route:
  app:
    parentRefs:
      - name: external
        namespace: gateway-system
        sectionName: https
    hostnames:
      - money.cjf.sh
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: app
            port: http

route:
  app:
    parentRefs:
      - name: external
        namespace: gateway-system
        sectionName: https
    hostnames:
      - money.cjf.sh
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: app
            port: http

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: zfs-dataset
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: /data
        readOnly: false

serviceAccount:
  actual-budget: {}

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cert-manager
    - name: certs
    - name: metallb-pool
  interval: 5m0s
  # Controller only. This Kustomization installs the Envoy Gateway HelmRelease,
  # which in turn installs the Gateway API CRDs. The data plane objects in
  # ../apps/envoy-gateway/gateway depend on those CRDs existing and must be
  # reconciled separately - see the `gateway` Kustomization. Pointing this at
  # the apps/envoy-gateway parent directory instead causes a bootstrap deadlock:
  # Flux dry-runs the whole object set before applying, so GatewayClass fails to
  # resolve, nothing is applied, and the HelmRelease that installs the CRDs is
  # never created.
  path: ./apps/envoy-gateway/controller
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 2m0s
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: super-productivity
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    # The HTTPRoute's CRDs must exist before the route is applied, otherwise
    # it silently fails.
    - name: envoy-gateway
  interval: 5m0s
  path: ./apps/super-productivity
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 2m0s
  wait: true
